spring.cloud.config.enabled=false
spring.config.import=optional:configserver:
eureka.client.enabled=false

# Necessario porque o config-repo (nao carregado em teste) normalmente define esta
# estrategia para preservar o nome exato de tabelas/colunas anotadas via @Table/@Column
# (ex.: "Client"); sem ela, o Hibernate faria lower/snake case e o schema real nao bateria.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
