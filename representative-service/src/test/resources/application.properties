spring.cloud.config.enabled=false
spring.config.import=optional:configserver:
eureka.client.enabled=false

# Necessario para os testes de integracao com Testcontainers: reproduz a mesma
# physical naming strategy configurada no config-server (evita que o Hibernate
# converta "Representative" para minusculo, o que quebraria no MySQL do container
# Linux, onde nomes de tabela sao case-sensitive).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
