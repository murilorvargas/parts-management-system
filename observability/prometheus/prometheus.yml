global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: discovery-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["discovery-server:8761"]

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8888"]

  - job_name: part-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["part-service-api:8080"]

  - job_name: client-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["client-service-api:8080"]

  - job_name: representative-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["representative-service-api:8080"]

  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]
